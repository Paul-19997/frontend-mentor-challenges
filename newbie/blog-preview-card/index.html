<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="css/style.css" />

    <title>Frontend Mentor | Blog preview card</title>
  </head>

  <body>
    <main>
      <figure class="container">
        <div class="img-box">
          <img
            src="./assets/images/illustration-article.svg"
            alt="illustration-article for the card"
            class="illustration-article-img"
          />
        </div>
        <div class="text-box">
          <header class="sub-heading">Learning</header>
          <p class="published-date">Published 21 Dec 2023</p>
          <h1 class="main-heading">
            <a
              href="https://developer.mozilla.org/en-US/search?q=html+and+css+foundation"
              class="link"
              target="_blank"
            >
              HTML & CSS foundations
            </a>
          </h1>
          <p class="description">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>
          <div class="author-box">
            <img
              src="/assets/images/image-avatar.webp"
              alt="photo of the author"
              class="author-img"
            />
            <p class="author-name">Greg Hooper</p>
          </div>
        </div>
      </figure>
    </main>
  </body>
</html>
